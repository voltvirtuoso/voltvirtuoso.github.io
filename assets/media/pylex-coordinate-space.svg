<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Why Pylex aligns PDF coordinates before adding OCR text</title>
<desc id="desc">A concrete before-and-after comparison. On the left, OCR text is placed using the wrong coordinate system and drifts away from the printed label. On the right, page rotation is transferred first and the invisible text layer sits directly over the printed label.</desc>
<style>
.bg{fill:#080c12}.panel{fill:#101821;stroke:#304252;stroke-width:2}.paper{fill:#eee9da;stroke:#f08a32;stroke-width:3}.ink{stroke:#58636a;stroke-width:3;fill:none}.printed{fill:#39444c;font:700 18px 'JetBrains Mono',monospace}.overlayWrong{fill:#f08a32;font:700 18px 'JetBrains Mono',monospace;opacity:.92}.overlayRight{fill:#79d6d1;font:700 18px 'JetBrains Mono',monospace;opacity:.55}.title{fill:#edf2f4;font:700 26px 'Space Grotesk',Arial,sans-serif}.sub{fill:#a8b3bc;font:16px 'Space Grotesk',Arial,sans-serif}.tiny{fill:#9aa8b4;font:600 14px 'JetBrains Mono',monospace}.orange{fill:#f08a32}.lime{fill:#b7d86b}.cyan{fill:#79d6d1}.bad{stroke:#f08a32;stroke-width:3;stroke-dasharray:8 8;fill:none;animation:dash 2s linear infinite}.good{stroke:#b7d86b;stroke-width:3;stroke-dasharray:3 7;fill:none;animation:dash 2s linear infinite}.arrow{stroke:#f08a32;stroke-width:4;fill:none;marker-end:url(#arrow);stroke-dasharray:12 12;animation:dash 2s linear infinite}.pulse{fill:#f08a32;animation:pulse 1.5s infinite}@keyframes dash{to{stroke-dashoffset:-40}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.bad,.good,.arrow,.pulse{animation:none}}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#f08a32"/></marker></defs>
<rect class="bg" width="1400" height="720" rx="20"/>
<text x="48" y="52" class="tiny orange">PYLEX / WHY COORDINATES MATTER</text><text x="48" y="92" class="title">The same detected word can be right—or visibly wrong—depending on the coordinate space.</text>
<!-- input strip --> <g transform="translate(48 135)"><rect class="panel" width="1304" height="115" rx="14"/><text x="28" y="35" class="tiny cyan">WHAT OCR SEES</text><text x="28" y="70" class="sub">The renderer produces the page in viewer orientation. OCR returns a word, confidence, and polygon in that image’s pixels.</text><rect class="paper" x="1010" y="27" width="235" height="62" rx="4"/><path class="ink" d="M1030 52h195M1030 72h130"/><text x="1103" y="84" class="printed">P-101</text></g>
<!-- wrong --> <g transform="translate(48 285)"><rect class="panel" width="610" height="340" rx="16"/><text x="28" y="42" class="title">Wrong merge</text><text x="28" y="70" class="sub">OCR image is rotated, but the PDF content space is not.</text><rect class="paper" x="88" y="105" width="270" height="205" rx="4"/><path class="ink" d="M108 145h230M108 183h160M108 221h230M108 259h120"/><text x="206" y="244" class="printed">P-101</text><text x="279" y="163" class="overlayWrong">P-101</text><path class="bad" d="M196 220h100v34H196z"/><path class="bad" d="M270 139h92v34h-92z"/><path class="arrow" d="M300 180l-5 35"/><circle class="pulse" cx="296" cy="216" r="6"/><text x="390" y="150" class="tiny orange">overlay drifts</text><text x="390" y="176" class="tiny orange">away from printed label</text><text x="390" y="230" class="sub">Search may find the word,</text><text x="390" y="253" class="sub">but selection/copy feels wrong.</text></g>
<!-- fix --> <g transform="translate(742 285)"><rect class="panel" width="610" height="340" rx="16"/><text x="28" y="42" class="title">Correct merge</text><text x="28" y="70" class="sub">Transfer rotation, then place the invisible text layer.</text><rect class="paper" x="88" y="105" width="270" height="205" rx="4"/><path class="ink" d="M108 145h230M108 183h160M108 221h230M108 259h120"/><text x="206" y="244" class="printed">P-101</text><text x="206" y="244" class="overlayRight">P-101</text><path class="good" d="M196 220h100v34H196z"/><circle class="pulse" cx="296" cy="236" r="6"/><text x="390" y="150" class="tiny lime">overlay sits on</text><text x="390" y="176" class="tiny lime">the detected polygon</text><text x="390" y="230" class="sub">The visible page stays unchanged;</text><text x="390" y="253" class="sub">the text becomes searchable.</text></g>
<text x="48" y="675" class="tiny lime">PYLEX RULE</text><text x="154" y="675" class="sub">Render like the viewer → run OCR → transfer page rotation → map polygons → merge an invisible text layer.</text>
</svg>
