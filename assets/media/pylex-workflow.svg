<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">How Pylex turns a technical drawing into a searchable PDF</title>
<desc id="desc">A detailed five-step explanation. A small label in a crowded drawing is missed by a whole-page OCR pass, recovered by overlapping high-resolution tiles, mapped back to page coordinates, and written as an invisible searchable text layer over the unchanged page.</desc>
<style>
.bg{fill:#080c12}.panel{fill:#101821;stroke:#304252;stroke-width:2}.paper{fill:#eee9da;stroke:#f08a32;stroke-width:3}.ink{stroke:#58636a;stroke-width:3;fill:none}.thin{stroke:#87949d;stroke-width:2;fill:none}.word{fill:#39444c;font:700 18px 'JetBrains Mono',monospace}.tiny{fill:#9aa8b4;font:600 13px 'JetBrains Mono',monospace}.label{fill:#edf2f4;font:700 20px 'Space Grotesk',Arial,sans-serif}.body{fill:#a8b3bc;font:15px 'Space Grotesk',Arial,sans-serif}.orange{fill:#f08a32}.lime{fill:#b7d86b}.cyan{fill:#79d6d1}.call{stroke:#f08a32;stroke-width:3;fill:none;stroke-dasharray:9 9;animation:dash 2s linear infinite}.tile{fill:#79d6d1;fill-opacity:.13;stroke:#79d6d1;stroke-width:3;stroke-dasharray:8 6;animation:glow 2.4s ease-in-out infinite}.tile2{animation-delay:.45s}.tile3{animation-delay:.9s}.box{fill:none;stroke:#b7d86b;stroke-width:3;animation:glow 1.8s ease-in-out infinite}.arrow{stroke:#f08a32;stroke-width:4;fill:none;marker-end:url(#arrow);stroke-dasharray:12 12;animation:dash 2s linear infinite}.dot{fill:#f08a32;animation:pulse 1.5s infinite}@keyframes dash{to{stroke-dashoffset:-42}}@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.call,.tile,.box,.arrow,.dot{animation:none}}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#f08a32"/></marker></defs>
<rect class="bg" width="1400" height="760" rx="20"/>
<text x="42" y="50" class="tiny orange">PYLEX / A CONCRETE OCR WALKTHROUGH</text><text x="42" y="87" class="label">The hard part is preserving meaning, position, and searchability.</text>
<!-- panel 1 --> <g transform="translate(30 135)"><rect class="panel" width="245" height="515" rx="16"/><text x="20" y="40" class="label">01  Source</text><text x="20" y="68" class="body">Crowded technical page</text><rect class="paper" x="25" y="100" width="195" height="240" rx="4"/><path class="ink" d="M42 145H205M42 185H165M42 225H205M42 265H145M42 305H205"/><path class="thin" d="M65 120V330M115 120V330M175 120V330M42 165H205M42 245H205"/><circle cx="145" cy="207" r="25" fill="none" stroke="#58636a" stroke-width="3"/><path d="M170 207h35M115 207H80" class="thin"/><text x="91" y="292" class="word">P-101</text><text x="43" y="380" class="tiny">small tag near line-art</text><text x="43" y="405" class="tiny">mixed orientations</text><text x="43" y="455" class="body">Input: PDF, PNG, JPG,</text><text x="43" y="478" class="body">TIFF, or a folder.</text></g>
<!-- panel 2 --> <g transform="translate(300 135)"><rect class="panel" width="245" height="515" rx="16"/><text x="20" y="40" class="label">02  Render</text><text x="20" y="68" class="body">Match the viewer’s page</text><rect class="paper" x="25" y="100" width="195" height="240" rx="4"/><path class="ink" d="M42 145H205M42 185H165M42 225H205M42 265H145M42 305H205"/><path class="thin" d="M65 120V330M115 120V330M175 120V330M42 165H205M42 245H205"/><circle cx="145" cy="207" r="25" fill="none" stroke="#58636a" stroke-width="3"/><text x="91" y="292" class="word">P-101</text><path class="call" d="M25 100H220V340H25z"/><circle class="dot" cx="25" cy="100" r="6"/><text x="43" y="380" class="tiny">/Rotate = 90° applied</text><text x="43" y="405" class="tiny">before OCR and overlay</text><text x="43" y="455" class="body">Pylex renders what a</text><text x="43" y="478" class="body">person actually sees.</text></g>
<!-- panel 3 --> <g transform="translate(570 135)"><rect class="panel" width="245" height="515" rx="16"/><text x="20" y="40" class="label">03  Detect</text><text x="20" y="68" class="body">Look locally, not globally</text><rect class="paper" x="25" y="100" width="195" height="240" rx="4"/><path class="ink" d="M42 145H205M42 185H165M42 225H205M42 265H145M42 305H205"/><path class="thin" d="M65 120V330M115 120V330M175 120V330M42 165H205M42 245H205"/><rect class="tile" x="35" y="115" width="92" height="105"/><rect class="tile tile2" x="118" y="180" width="92" height="105"/><rect class="tile tile3" x="35" y="255" width="92" height="70"/><rect class="box" x="119" y="193" width="43" height="24"/><text x="124" y="212" class="tiny">P-101</text><text x="43" y="380" class="tiny">overlap keeps labels large</text><text x="43" y="405" class="tiny">enough for detection</text><text x="43" y="455" class="body">Tiles are merged and</text><text x="43" y="478" class="body">duplicates removed.</text></g>
<!-- panel 4 --> <g transform="translate(840 135)"><rect class="panel" width="245" height="515" rx="16"/><text x="20" y="40" class="label">04  Align</text><text x="20" y="68" class="body">Map polygons back</text><rect class="paper" x="25" y="100" width="195" height="240" rx="4"/><path class="ink" d="M42 145H205M42 185H165M42 225H205M42 265H145M42 305H205"/><path class="thin" d="M65 120V330M115 120V330M175 120V330M42 165H205M42 245H205"/><path class="call" d="M119 193h43v24h-43z"/><path class="arrow" d="M162 205l42 -42"/><text x="43" y="380" class="tiny">polygon → original pixels</text><text x="43" y="405" class="tiny">anchor at line start</text><text x="43" y="455" class="body">Long lines stay inside</text><text x="43" y="478" class="body">the page boundaries.</text></g>
<!-- panel 5 --> <g transform="translate(1110 135)"><rect class="panel" width="245" height="515" rx="16"/><text x="20" y="40" class="label">05  Search</text><text x="20" y="68" class="body">Add an invisible text layer</text><rect class="paper" x="25" y="100" width="195" height="240" rx="4"/><path class="ink" d="M42 145H205M42 185H165M42 225H205M42 265H145M42 305H205"/><path class="thin" d="M65 120V330M115 120V330M175 120V330M42 165H205M42 245H205"/><text x="91" y="292" class="word">P-101</text><path class="box" d="M40 133H207M40 173H167M40 213H207M40 253H147M40 293H207"/><text x="43" y="380" class="tiny">visible drawing preserved</text><text x="43" y="405" class="tiny">text layer follows it</text><text x="43" y="455" class="body">Search, select, and copy</text><text x="43" y="478" class="body">without redrawing the page.</text></g>
<text x="42" y="710" class="tiny lime">RESULT</text><text x="118" y="710" class="body">Original visible page preserved  +  invisible OCR layer aligned to it  =  searchable, selectable, copyable PDF</text>
</svg>
